[env]
PYTHON_VERSION = "3.12"

[phases.setup]
# Ensure Python is installed before you try to use it
cmds = [
    "nix-env -iA nixpkgs.python312",   # installs Python 3.12
    "python3 -m ensurepip --upgrade",
    "python3 -m pip install --upgrade pip"
]

[phases.build]
cmds = [
    "python3 -m venv --copies /opt/venv",
    ". /opt/venv/bin/activate && pip install -r requirements.txt",
    "python3 manage.py collectstatic --noinput"
]

[phases.deploy]
cmd = "python3 manage.py migrate --noinput && gunicorn burst.wsgi:application --workers 2 --bind 0.0.0.0:$PORT --timeout 300"
