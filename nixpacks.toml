[phases.setup]
packages = ["python3", "python3-pip", "gcc", "libffi-dev", "libssl-dev", "python3-dev"]

[phases.install]
cmds = [
    "pip3 install --upgrade pip",
    "pip3 install -r requirements.txt"
]

[phases.build]
cmds = [
    "python3 manage.py collectstatic --noinput"
]

[phases.start]
cmds = [
    "python3 manage.py makemigrations",
    "python3 manage.py migrate",
    "gunicorn burst.wsgi:application --workers 2 --bind 0.0.0.0:$PORT"
]
