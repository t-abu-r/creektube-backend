name: Djano CI

on:
  push:
    branches: [ test ]

jobs:
  build:
    runs-on:ubuntu-latest

    steps:
      -uses: actions/checkout@v5

      -name: SETTIN UP PYTHON
       uses: actions/setup-python@v5
       with:
         python-version: 3.11
         cache: "pip"

      -name: INstall dependencies
       run: pip install -r requirements.txt

      -name: Run tests
       run: python manage.py test
       if: success()
       - action: "Merge develop into main"
       type: "GIT_MERGE"
       branch: "test"
       targetBranch: "main"